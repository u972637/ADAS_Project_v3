requires-python = ">=3.10,<3.11"
dependencies = [
    "flask>=3.0",
    "lap>=0.5.12",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "pillow>=10.0",
    "pyserial>=3.5",
    "ruckig==0.19.4",
    "scipy>=1.10",
    "ultralytics==8.4.72",
]

[tool.uv]
package = false
